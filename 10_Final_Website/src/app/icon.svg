<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="sfBg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#12203A"/>
      <stop offset="100%" stop-color="#070B14"/>
    </radialGradient>
    <linearGradient id="sfGold" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#F6D089"/>
      <stop offset="100%" stop-color="#E9A23B"/>
    </linearGradient>
    <linearGradient id="sfBlue" x1="0" y1="0" x2="64" y2="64">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Navy badge -->
  <circle cx="32" cy="32" r="31" fill="url(#sfBg)"/>
  <circle cx="32" cy="32" r="20" stroke="url(#sfBlue)" stroke-width="2" opacity="0.35" fill="none"/>

  <!-- Rotating gold arc -->
  <g>
    <path d="M32 9 A23 23 0 0 1 55 32" stroke="url(#sfGold)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      from="0 32 32" to="360 32 32" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Counter-rotating blue arc -->
  <g>
    <path d="M32 55 A23 23 0 0 1 9 32" stroke="url(#sfBlue)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <animateTransform attributeName="transform" attributeType="XML" type="rotate"
      from="360 32 32" to="0 32 32" dur="8s" repeatCount="indefinite"/>
  </g>

  <!-- Pulsing intelligence core -->
  <circle cx="32" cy="32" r="6" fill="url(#sfBlue)">
    <animate attributeName="r" values="5.5;7.2;5.5" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/>
  </circle>
</svg>
